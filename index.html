<!DOCTYPE html>
<html>
    <head>
	<title>Canva</title>
	<style>
	    body{
		background-color: black;
		padding: 2rem;
	    }
	    .container{
		display: flex;
		align-items: center;
		justify-content: center;
	    }
	    .exampleContainer{
		display: flex;
		flex-direction: column;
		align-items: center;
	    }
	    #btns{
		min-width: 5rem;
		display: flex;
		flex-direction: column;
	    }
	</style>
    </head>
    <body>
	<div class="container">
	    <canvas id="canvas"></canvas>
	    <div id="btns">
		<button id="run">Run</button>
		<button id="next">Next</button>
	    	<button id="clear">Clear</button>
		<div>
		    <input type="checkbox" id="eraseBtn" name="eraseBtn"/>
		    <label for="eraseBtn">Erase</label>
		</div>
	    </div>
	</div>

	<div class="exampleContainer">
	    <h1>Examples of Patterns</h1>

	    <div class="example">
		<h2>Spaceships</h2>
		<div>
		    <img src="./assets/Game_of_life_animated_glider.gif"/>
		    <img src="./assets/Game_of_life_animated_LWSS.gif"/>
		    <img src="./assets/Animated_Hwss.gif"/>
		</div>
	    </div>

	    <div class="example">
		<h2>Oscillators</h2>
		<div>
		    <img src="./assets/Game_of_life_blinker.gif"/>
		    <img src="./assets/Game_of_life_beacon.gif"/>
		    <img src="./assets/Game_of_life_pulsar.gif"/>
		</div>
	    </div>

	    <div class="example">
		<h2>Still lifes</h2>
		<div>
		    <img
		    src="./assets/99px-Game_of_life_block_with_border.svg.png"
		    />
		    <img src="./assets/Game_of_life_boat.svg.png"/>
		    <img src="./assets/147px-Game_of_life_beehive.svg.png"/>
		</div>
	    </div>

	</div>
	<script src="gol.js"></script>
    </body>
</html>
